<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>💌 Aşkımın Köşesi</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --rose:#ff4d79;
  --rose-light:#ff85a1;
  --rose-pale:#ffe0e9;
  --cream:#fff5f7;
  --deep:#3d1a2e;
  --mid:#7a3558;
  --text:#4a1a35;
  --bubble-me:linear-gradient(135deg,#ff4d79,#ff85a1);
  --bubble-them:linear-gradient(135deg,#ffffff,#ffe8f0);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Nunito',sans-serif;
  background:var(--cream);
  min-height:100vh;
  overflow:hidden;
  position:relative;
}

/* BACKGROUND */

.bg-canvas{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  background:
    radial-gradient(circle at top left,#ffd6e7,transparent 35%),
    radial-gradient(circle at bottom right,#ffc3d7,transparent 35%),
    linear-gradient(160deg,#fff0f5 0%,#ffe8f0 40%,#ffd6e7 100%);
}

.heart-particle{
  position:absolute;
  font-size:1rem;
  opacity:0;
  animation:floatUp linear infinite;
}

@keyframes floatUp{
  0%{
    opacity:0;
    transform:translateY(0) scale(.5);
  }
  10%{
    opacity:.8;
  }
  100%{
    opacity:0;
    transform:translateY(-110vh) scale(1.3) rotate(20deg);
  }
}

/* APP */

#app{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  height:100dvh;
  max-width:430px;
  margin:auto;
}

/* HEADER */

header{
  background:linear-gradient(135deg,#ff4d79 0%,#c0235a 100%);
  padding:14px 18px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 2px 20px rgba(255,77,121,.4);
}

.avatar-wrap{
  position:relative;
}

.avatar{
  width:46px;
  height:46px;
  border-radius:50%;
  background:linear-gradient(135deg,#ffb3c6,#ff4d79);
  border:2px solid rgba(255,255,255,.7);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.6rem;
}

.online-dot{
  position:absolute;
  width:12px;
  height:12px;
  background:#4ade80;
  border-radius:50%;
  border:2px solid white;
  right:0;
  bottom:0;
}

.header-info{
  flex:1;
}

.header-name{
  font-family:'Dancing Script',cursive;
  font-size:1.45rem;
  color:white;
  font-weight:700;
}

.header-status{
  font-size:.72rem;
  color:rgba(255,255,255,.9);
}

.header-actions{
  display:flex;
  gap:8px;
}

.header-btn{
  width:36px;
  height:36px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  color:white;
  cursor:pointer;
  font-size:1rem;
}

/* SECRET BUTTON */

#secret-btn{
  position:absolute;
  top:7px;
  right:6px;
  opacity:.03;
  border:none;
  background:none;
  color:white;
  font-size:10px;
  cursor:pointer;
}

/* WHO BAR */

#who-bar{
  display:flex;
  gap:10px;
  padding:8px 16px;
  background:rgba(255,255,255,.8);
  backdrop-filter:blur(10px);
}

#who-bar span{
  font-size:.75rem;
  color:var(--mid);
  font-weight:700;
}

.who-btn{
  flex:1;
  padding:6px;
  border-radius:20px;
  border:1px solid var(--rose-light);
  background:white;
  color:var(--mid);
  font-weight:700;
  cursor:pointer;
}

.who-btn.active{
  background:var(--bubble-me);
  color:white;
  border:none;
}

/* MESSAGES */

#messages{
  flex:1;
  overflow-y:auto;
  padding:16px 14px 10px;
  display:flex;
  flex-direction:column;
  gap:10px;
  scrollbar-width:thin;
}

.day-label{
  align-self:center;
  background:rgba(255,77,121,.08);
  padding:4px 12px;
  border-radius:30px;
  font-size:.65rem;
  color:var(--mid);
  font-weight:700;
}

.bubble-wrap{
  display:flex;
  flex-direction:column;
  max-width:80%;
  animation:popIn .25s ease;
}

@keyframes popIn{
  from{
    opacity:0;
    transform:translateY(10px) scale(.8);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.me{
  align-self:flex-end;
  align-items:flex-end;
}

.them{
  align-self:flex-start;
  align-items:flex-start;
}

.bubble{
  padding:10px 14px;
  border-radius:20px;
  line-height:1.45;
  font-size:.92rem;
  word-break:break-word;
}

.me .bubble{
  background:var(--bubble-me);
  color:white;
  border-bottom-right-radius:5px;
}

.them .bubble{
  background:var(--bubble-them);
  color:var(--text);
  border-bottom-left-radius:5px;
}

.bubble-meta{
  margin-top:4px;
  font-size:.62rem;
  color:var(--mid);
}

/* EMPTY */

#empty-state{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  gap:10px;
  padding:20px;
  color:var(--mid);
}

.big-heart{
  font-size:4rem;
  animation:beat 1.5s infinite;
}

@keyframes beat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.15)}
}

#empty-state h2{
  font-family:'Dancing Script',cursive;
  font-size:1.7rem;
  color:var(--rose);
}

/* INPUT */

#input-area{
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:10px 12px;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(10px);
}

#msg-input{
  flex:1;
  border-radius:22px;
  border:1px solid rgba(255,77,121,.25);
  padding:10px 14px;
  resize:none;
  outline:none;
  min-height:42px;
  max-height:110px;
  font-family:'Nunito',sans-serif;
}

.send-btn,
.emoji-btn{
  width:44px;
  height:44px;
  border:none;
  border-radius:50%;
  cursor:pointer;
}

.send-btn{
  background:linear-gradient(135deg,#ff4d79,#c0235a);
  color:white;
  font-size:1.1rem;
}

.emoji-btn{
  background:var(--rose-pale);
  color:var(--rose);
}

/* EMOJI PICKER */

#emoji-picker{
  display:none;
  flex-wrap:wrap;
  gap:5px;
  padding:10px;
  background:white;
}

#emoji-picker.open{
  display:flex;
}

.ep-emoji{
  font-size:1.4rem;
  cursor:pointer;
}

/* TOAST */

#toast{
  position:fixed;
  top:80px;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(135deg,#ff4d79,#c0235a);
  color:white;
  padding:10px 18px;
  border-radius:30px;
  opacity:0;
  transition:.3s;
  z-index:999;
}

#toast.show{
  opacity:1;
}

/* SECRET MODAL */

#secret-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
  backdrop-filter:blur(6px);
}

#secret-modal.open{
  display:flex;
}

.secret-box{
  width:90%;
  max-width:320px;
  background:white;
  border-radius:24px;
  padding:24px;
  text-align:center;
  animation:popIn .3s ease;
}

.secret-box h2{
  font-family:'Dancing Script',cursive;
  color:var(--rose);
  margin-bottom:10px;
  font-size:1.8rem;
}

.secret-box p{
  color:var(--mid);
  margin-bottom:18px;
}

.secret-box a{
  display:inline-block;
  padding:10px 18px;
  border-radius:20px;
  text-decoration:none;
  color:white;
  background:linear-gradient(135deg,#ff4d79,#c0235a);
  font-weight:700;
}

.close-secret{
  margin-top:12px;
  background:none;
  border:none;
  color:var(--mid);
  cursor:pointer;
}

/* TYPING */

#typing-indicator{
  display:none;
  align-self:flex-start;
  background:white;
  padding:10px 16px;
  border-radius:20px;
  gap:5px;
}

#typing-indicator.show{
  display:flex;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--rose);
  animation:bounce 1s infinite;
}

.dot:nth-child(2){
  animation-delay:.2s;
}

.dot:nth-child(3){
  animation-delay:.4s;
}

@keyframes bounce{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-5px);
  }
}
</style>
</head>

<body>

<div class="bg-canvas" id="bgCanvas"></div>

<div id="app">

<header>

<button id="secret-btn" onclick="openSecret()">Emre</button>

<div class="avatar-wrap">
<div class="avatar">🌹</div>
<div class="online-dot"></div>
</div>

<div class="header-info">
<div class="header-name">Aşkımın Köşesi 💕</div>
<div class="header-status" id="header-status">Çevrimiçi ✨</div>
</div>

<div class="header-actions">
<button class="header-btn" onclick="clearChat()">🗑️</button>
<button class="header-btn" onclick="notifyByMail()">📧</button>
</div>

</header>

<div id="who-bar">
<span>Ben:</span>

<button class="who-btn active" id="btn-me" onclick="setWho('me')">
💖 Ben
</button>

<button class="who-btn" id="btn-them" onclick="setWho('them')">
🌹 Aşkım
</button>
</div>

<div id="messages">

<div id="empty-state">
<div class="big-heart">💝</div>
<h2>Merhaba Aşkım 🌹</h2>
<p>
Bu sizin özel köşeniz 💌<br>
Yazdığınız her mesaj burada saklı kalacak ❤️
</p>
</div>

<div id="typing-indicator">
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>

</div>

<div id="emoji-picker"></div>

<div id="input-area">

<button class="emoji-btn" onclick="toggleEmoji()">
😊
</button>

<textarea
id="msg-input"
placeholder="Aşkıma bir şey yaz... 💕"
rows="1"
onkeydown="handleKey(event)"
oninput="autoResize(this)">
</textarea>

<button class="send-btn" onclick="sendMessage()">
💌
</button>

</div>

</div>

<!-- SECRET MODAL -->

<div id="secret-modal">

<div class="secret-box">

<h2>💖 Emre</h2>

<p>
Bunu ben ekledim ❤️
</p>

<a download="emre-not.txt"
href="data:text/plain;charset=utf-8,Bunu%20ben%20ekledim%20%E2%9D%A4%EF%B8%8F">
Dosyayı İndir 📥
</a>

<br>

<button class="close-secret" onclick="closeSecret()">
Kapat
</button>

</div>

</div>

<div id="toast"></div>

<script>

/* STATE */

const STORAGE_KEY = 'ask_chat_messages_v2';

let currentWho = 'me';
let messages = [];

const EMOJIS = [
'❤️','💕','💖','💗','💘','💝','💞',
'🌹','🌸','😍','🥰','😘','✨',
'💫','😊','🎀','🌈','💐'
];

/* INIT */

document.addEventListener('DOMContentLoaded',()=>{

  loadMessages();
  buildEmojiPicker();
  spawnHearts();

});

/* HEARTS */

function spawnHearts(){

  const canvas = document.getElementById('bgCanvas');

  const hearts = ['❤️','💕','💖','🌹','✨','🌸'];

  for(let i=0;i<18;i++){

    const h = document.createElement('div');

    h.className = 'heart-particle';

    h.textContent = hearts[Math.floor(Math.random()*hearts.length)];

    h.style.left = Math.random()*100 + '%';

    h.style.bottom = '-20px';

    h.style.animationDuration = (8 + Math.random()*8) + 's';

    h.style.fontSize = (.8 + Math.random()) + 'rem';

    canvas.appendChild(h);

  }

}

/* SECRET */

function openSecret(){

  document.getElementById('secret-modal').classList.add('open');

}

function closeSecret(){

  document.getElementById('secret-modal').classList.remove('open');

}

/* WHO */

function setWho(who){

  currentWho = who;

  document.getElementById('btn-me').classList.toggle('active',who==='me');

  document.getElementById('btn-them').classList.toggle('active',who==='them');

}

/* EMOJIS */

function buildEmojiPicker(){

  const picker = document.getElementById('emoji-picker');

  EMOJIS.forEach(e=>{

    const el = document.createElement('span');

    el.className = 'ep-emoji';

    el.textContent = e;

    el.onclick = ()=>insertEmoji(e);

    picker.appendChild(el);

  });

}

function toggleEmoji(){

  document.getElementById('emoji-picker').classList.toggle('open');

}

function insertEmoji(e){

  const inp = document.getElementById('msg-input');

  inp.value += e;

  inp.focus();

}

/* TEXTAREA */

function autoResize(el){

  el.style.height = 'auto';

  el.style.height = Math.min(el.scrollHeight,110) + 'px';

}

/* ENTER */

function handleKey(e){

  if(e.key === 'Enter' && !e.shiftKey){

    e.preventDefault();

    sendMessage();

  }

}

/* STORAGE */

function saveMessages(){

  localStorage.setItem(STORAGE_KEY,JSON.stringify(messages));

}

function loadMessages(){

  const raw = localStorage.getItem(STORAGE_KEY);

  if(raw){

    messages = JSON.parse(raw);

    renderAll();

  }

}

/* RENDER */

function renderAll(){

  const container = document.getElementById('messages');

  const typing = document.getElementById('typing-indicator');

  const empty = document.getElementById('empty-state');

  [...container.children].forEach(c=>{

    if(c!==typing && c!==empty){

      c.remove();

    }

  });

  if(messages.length===0){

    empty.style.display='flex';

    return;

  }

  empty.style.display='none';

  let lastDate='';

  messages.forEach(m=>{

    const d = new Date(m.ts);

    const dateStr = d.toLocaleDateString('tr-TR',{

      day:'numeric',
      month:'long',
      year:'numeric'

    });

    if(dateStr!==lastDate){

      lastDate=dateStr;

      const div=document.createElement('div');

      div.className='day-label';

      div.textContent=dateStr;

      container.insertBefore(div,typing);

    }

    container.insertBefore(createBubble(m),typing);

  });

  scrollBottom();

}

function createBubble(m){

  const wrap=document.createElement('div');

  wrap.className='bubble-wrap '+m.who;

  const bubble=document.createElement('div');

  bubble.className='bubble';

  bubble.textContent=m.text;

  const meta=document.createElement('div');

  meta.className='bubble-meta';

  const time = new Date(m.ts).toLocaleTimeString('tr-TR',{

    hour:'2-digit',
    minute:'2-digit'

  });

  meta.innerHTML =
  (m.who==='me' ? '💖 Sen' : '🌹 Aşkın')
  +' • '+time;

  wrap.appendChild(bubble);

  wrap.appendChild(meta);

  return wrap;

}

function scrollBottom(){

  const c=document.getElementById('messages');

  requestAnimationFrame(()=>{

    c.scrollTop=c.scrollHeight;

  });

}

/* SEND */

function sendMessage(){

  const inp=document.getElementById('msg-input');

  const text=inp.value.trim();

  if(!text) return;

  const msg={

    who:currentWho,
    text,
    ts:Date.now()

  };

  messages.push(msg);

  saveMessages();

  renderAll();

  inp.value='';

  inp.style.height='auto';

  showToast('💌 Mesaj gönderildi');

}

/* CLEAR */

function clearChat(){

  if(confirm('Tüm mesajlar silinsin mi?')){

    messages=[];

    saveMessages();

    renderAll();

    showToast('🗑️ Mesajlar silindi');

  }

}

/* MAIL */

function notifyByMail(){

  const last = messages[messages.length-1];

  const body = last
  ? last.text
  : 'Henüz mesaj yok';

  window.open(
    'mailto:?subject='
    + encodeURIComponent('💌 Yeni mesaj')
    + '&body='
    + encodeURIComponent(body)
  );

}

/* TOAST */

function showToast(msg){

  const t=document.getElementById('toast');

  t.textContent=msg;

  t.classList.add('show');

  clearTimeout(t.timer);

  t.timer=setTimeout(()=>{

    t.classList.remove('show');

  },3000);

}

</script>

</body>
</html>
